name: Publish Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      # Matches tags like v1.0.0, v2.3.5, etc.

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history and tags so `git describe` finds the version.
          fetch-depth: 0

      # Fails before anything is published when CHANGELOG.md has no
      # section for this tag.
      - name: Extract release notes from CHANGELOG.md
        run: make release-notes VERSION="${{ github.ref_name }}"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Check Go toolchain matches go.mod
        run: make check-toolchain

      - name: Run tests
        run: make tests

      # Build all application variants (macOS & Linux, x86_64 & arm64)
      - name: Build all variants
        run: make build-all

      - name: Generate checksums
        run: make checksums

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists, uploading assets to it."
          else
            gh release create "${{ github.ref_name }}" \
              --title "Release ${{ github.ref_name }}" \
              --notes-file tmp/release-notes.md
          fi

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Upload the binaries (aws-sso-login_<os>_<arch>) and the checksums file.
          gh release upload "${{ github.ref_name }}" ./tmp/aws-sso-login_* --clobber
