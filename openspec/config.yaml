schema: spec-driven

# Project context: constraints an agent cannot infer by reading the code.
# General documentation lives in README.md and AGENTS.md; do not duplicate it here.
context: |
  Language: write every OpenSpec artifact (proposal, specs, design, tasks) in English.

  Product: aws-sso-login is a single-binary Go CLI for AWS IAM Identity Center (AWS SSO)
  users. Commands: console, export, import, process, version.

  Platforms: macOS and Linux on amd64 and arm64 are supported and released.
  Windows is best-effort and untested; do not promise Windows behavior in specs.
  Binaries are built with CGO_ENABLED=0 and must stay statically linked.

  Runtime dependency: the tool shells out to AWS CLI v2 (`aws sso login`,
  `aws sts get-caller-identity`) and reads files the AWS CLI owns
  (~/.aws/config, ~/.aws/credentials, ~/.aws/cli/cache). Changes must stay
  compatible with the AWS CLI v2 file formats and cache-key algorithm, and must
  honor AWS_CONFIG_FILE and AWS_SHARED_CREDENTIALS_FILE.

  Output contracts (treat as public API, changing them is BREAKING):
  - `export` stdout must be safe to `eval` in POSIX shells.
  - `process` stdout must contain only the credential_process JSON (Version 1).
  - Diagnostics and logs go to stderr.
  - Exit statuses: 0 success, 1 other failure, 2 usage error (bad flags or
    arguments, no profile where no picker is allowed), 3 not signed in to
    AWS SSO or `aws sso login` failed, 4 SSO role not assigned, 5 AWS CLI not
    found, 130 profile picker cancelled.
  - Existing flag names and defaults are public API.

  Security: never print or log secrets (access keys, secret keys, session tokens,
  SSO access tokens). Files containing credentials must be written with 0600
  permissions. Examples use placeholders such as 123456789012 and
  https://example.awsapps.com/start.

  Testing: tests must never read or write the real ~/.aws directory, never invoke
  the real AWS CLI, and never call AWS endpoints. Use temp dirs, env overrides and
  injected fakes. CI runs without AWS credentials.

  Dependencies: keep the dependency set small. A new third-party module requires a
  justification in design.md.

  Workflow (applies to every OpenSpec step, from propose to archive):
  - Validation: run `openspec validate <change-id> --strict` after creating or
    editing any change artifact and before every commit; do not continue or commit
    while it reports errors. Run `openspec validate --all --strict` before opening
    a PR and before archiving.
  - Commits: commit after each logical change (one artifact set, one task group,
    one fix), not one commit for the whole change. Use Conventional Commits
    (feat:, fix:, docs:, test:, refactor:, chore:) and never commit a red build.
  - GitHub issues (repo witnsby/aws-sso-login): before proposing, search for
    related issues with `gh issue list --state all --search "<keywords>"`.
    Reference them in every commit that addresses them (`Refs #N` for partial
    work, `Closes #N` in the commit that completes the issue) and in the PR
    description (`Closes #N` for each fully resolved issue, `Refs #N` for each
    partially addressed one) so GitHub closes them on merge.

rules:
  proposal:
    - "State the user-visible impact on each affected command (console, export, import, process)."
    - "Mark any change to flags, defaults, stdout format or exit codes as **BREAKING**."
    - "List what is explicitly out of scope."
    - "Add a 'Related issues' section listing every related GitHub issue as #N, marked Closes (fully resolved by this change) or Refs (partially addressed); write 'None found' with the search terms used when there are none."
  specs:
    - "Write scenarios for both the explicit --profile path and the interactive picker when profile selection is involved."
    - "Cover failure scenarios: expired SSO token, role not assigned to the user, missing AWS CLI, missing or invalid profile."
    - "Specify which output goes to stdout and which goes to stderr."
    - "Cover both legacy SSO profiles (sso_start_url in the profile) and sso-session profiles when profile parsing is involved."
  design:
    - "Explain how the change interacts with AWS CLI config, credentials and cache formats."
    - "Describe platform differences between macOS and Linux when the change touches processes, browsers, file paths or permissions."
    - "Describe how external commands, the filesystem and HTTP are abstracted so the change can be unit-tested."
  tasks:
    - "Pair every behavior change with a unit test task."
    - "Include a README.md and CHANGELOG.md (Unreleased section) update task for user-visible changes."
    - "Make each top-level task group one logical change that ends with its own commit step, naming the Conventional Commit message and the Refs/Closes #N issue references it carries."
    - "End with a verification task: make tests, go vet ./..., gofmt -l ./src returns nothing, openspec validate <change-id> --strict passes."
    - "Add a final PR task: the PR description links the change id and lists Closes #N for every resolved issue and Refs #N for every partially addressed one."

operations:
  apply:
    guidance:
      - "Do not run `aws sso login`, other AWS CLI commands or AWS API calls while implementing or testing."
      - "Wrap errors with fmt.Errorf(\"...: %w\", err); either log an error or return it, not both."
      - "Keep diffs minimal and do not reformat unrelated files."
      - "Commit after each completed task group: tick its checkboxes in tasks.md, run make tests, go vet ./... and gofmt -l ./src, then commit code, tests and tasks.md together. Never batch the whole change into one commit."
      - "Run openspec validate <change-id> --strict before every commit and after any edit to proposal, specs, design or tasks; fix every finding first."
      - "Carry the issue references from proposal.md: Refs #N in commits that partially address an issue, Closes #N in the commit that completes it."
      - "When opening the PR, list Closes #N for every issue the change resolves and Refs #N for partially addressed ones in the description, and run openspec validate --all --strict first."
  archive:
    guidance:
      - "Confirm CHANGELOG.md and README.md reflect the archived behavior before archiving."
      - "Run openspec validate <change-id> --strict before archiving and openspec validate --all --strict after; commit the archive as its own commit."
      - "Check that every issue listed as Closes in proposal.md is referenced with a closing keyword in the PR; report any related issue that stays open instead of closing it by hand."
